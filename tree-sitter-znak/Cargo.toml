[package]
authors = [ "noClaps <contact@zerolimits.dev>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Znak grammar for tree-sitter"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "znak" ]
license = "0BSD"
name = "tree-sitter-znak"
readme = "README.md"
repository = "https://github.com/noClaps/zed-znak"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.1"
